<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Ingestion Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-align: center;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .metric-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }
        
        .metric-card:hover {
            transform: translateY(-5px);
        }
        
        .metric-label {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .metric-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
        }
        
        .metric-value.error {
            color: #e74c3c;
        }
        
        .metric-value.warning {
            color: #f39c12;
        }
        
        .metric-value.success {
            color: #27ae60;
        }
        
        .section {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: #555;
        }
        
        tr:hover {
            background-color: #f5f5f5;
        }
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }
        
        .status-healthy {
            background-color: #27ae60;
        }
        
        .status-warning {
            background-color: #f39c12;
        }
        
        .status-error {
            background-color: #e74c3c;
        }
        
        .refresh-info {
            color: #666;
            font-size: 0.9em;
            text-align: right;
            margin-top: 10px;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .updating {
            animation: pulse 1s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Log Ingestion Dashboard</h1>
        
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Total Logs</div>
                <div class="metric-value" id="totalLogs">0</div>
            </div>
            
            <div class="metric-card">
                <div class="metric-label">Throughput</div>
                <div class="metric-value" id="throughput">0</div>
                <small>logs/sec</small>
            </div>
            
            <div class="metric-card">
                <div class="metric-label">Error Rate</div>
                <div class="metric-value" id="errorRate">0%</div>
            </div>
            
            <div class="metric-card">
                <div class="metric-label">Queue Backlog</div>
                <div class="metric-value" id="queueBacklog">0</div>
            </div>
        </div>
        
        <div class="section">
            <h2>📊 Top 5 Services by Volume</h2>
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Service</th>
                        <th>Log Count</th>
                        <th>Percentage</th>
                    </tr>
                </thead>
                <tbody id="topServices">
                    <tr>
                        <td colspan="4">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="section">
            <h2>📈 Log Levels</h2>
            <table>
                <thead>
                    <tr>
                        <th>Level</th>
                        <th>Count</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="logLevels">
                    <tr>
                        <td colspan="3">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="section">
            <h2>🔍 System Status</h2>
            <table>
                <thead>
                    <tr>
                        <th>Component</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="systemStatus">
                    <tr>
                        <td colspan="2">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="refresh-info" id="lastUpdated">
            Last updated: Never
        </div>
    </div>
    
    <script>
        async function fetchMetrics() {
            try {
                const response = await fetch('/metrics');
                const metrics = await response.json();
                updateDashboard(metrics);
                
                // Update last updated time
                document.getElementById('lastUpdated').textContent = 
                    'Last updated: ' + new Date().toLocaleTimeString();
            } catch (error) {
                console.error('Failed to fetch metrics:', error);
            }
        }
        
        function updateDashboard(metrics) {
            // Update total logs
            document.getElementById('totalLogs').textContent = 
                metrics.total_logs.toLocaleString();
            
            // Update throughput
            document.getElementById('throughput').textContent = 
                metrics.throughput.toFixed(2);
            
            // Update error rate
            const errorRate = metrics.error_rate.toFixed(1);
            const errorRateElement = document.getElementById('errorRate');
            errorRateElement.textContent = errorRate + '%';
            errorRateElement.className = 'metric-value ' + 
                (errorRate > 10 ? 'error' : errorRate > 5 ? 'warning' : 'success');
            
            // Update queue backlog
            const backlog = metrics.queue_backlog;
            const backlogElement = document.getElementById('queueBacklog');
            backlogElement.textContent = backlog.toLocaleString();
            backlogElement.className = 'metric-value ' + 
                (backlog > 5000 ? 'error' : backlog > 1000 ? 'warning' : 'success');
            
            // Update top services
            updateTopServices();
            
            // Update log levels
            updateLogLevels(metrics.logs_by_level);
            
            // Update system status
            updateSystemStatus(metrics);
        }
        
        async function updateTopServices() {
            try {
                const response = await fetch('/metrics/top-services?limit=5');
                const data = await response.json();
                const tbody = document.getElementById('topServices');
                
                if (data.top_services.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4">No data available</td></tr>';
                    return;
                }
                
                const totalLogs = data.top_services.reduce((sum, s) => sum + s.count, 0);
                
                tbody.innerHTML = data.top_services.map((service, index) => {
                    const percentage = totalLogs > 0 ? (service.count / totalLogs * 100).toFixed(1) : 0;
                    return `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${service.service}</td>
                            <td>${service.count.toLocaleString()}</td>
                            <td>${percentage}%</td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                console.error('Failed to fetch top services:', error);
            }
        }
        
        function updateLogLevels(levels) {
            const tbody = document.getElementById('logLevels');
            const levelColors = {
                INFO: 'success',
                WARN: 'warning',
                ERROR: 'error',
                DEBUG: ''
            };
            
            tbody.innerHTML = Object.entries(levels).map(([level, count]) => {
                const statusClass = levelColors[level] || '';
                return `
                    <tr>
                        <td>${level}</td>
                        <td>${count.toLocaleString()}</td>
                        <td>
                            <span class="status-indicator status-${statusClass}"></span>
                            ${statusClass || 'normal'}
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        async function updateSystemStatus(metrics) {
            const tbody = document.getElementById('systemStatus');
            
            try {
                const healthResponse = await fetch('/health');
                const health = await healthResponse.json();
                
                const statuses = [
                    {
                        component: 'API Server',
                        status: health.status === 'healthy' ? 'healthy' : 'error',
                        details: health.status
                    },
                    {
                        component: 'Queue System',
                        status: health.queueStatus?.usingFallback ? 'warning' : 'healthy',
                        details: health.queueStatus?.usingFallback ? 'Using fallback' : 'RabbitMQ connected'
                    },
                    {
                        component: 'Channel Buffer',
                        status: health.channelUtilization > 80 ? 'warning' : 'healthy',
                        details: `${health.channelUtilization.toFixed(1)}% utilized`
                    },
                    {
                        component: 'Storage',
                        status: 'healthy',
                        details: `${health.storageStats?.totalLogs || 0} logs stored`
                    }
                ];
                
                tbody.innerHTML = statuses.map(s => `
                    <tr>
                        <td>${s.component}</td>
                        <td>
                            <span class="status-indicator status-${s.status}"></span>
                            ${s.details}
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="2">Failed to load system status</td></tr>';
            }
        }
        
        // Fetch metrics immediately
        fetchMetrics();
        
        // Auto-refresh every 5 seconds
        setInterval(fetchMetrics, 5000);
    </script>
</body>
</html>
